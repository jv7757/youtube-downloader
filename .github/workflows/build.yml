name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # 当推送 v1.0.0 格式的 tag 时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure Git Bash (Windows)
        if: matrix.platform == 'win'
        run: npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"

      - name: Install dependencies
        shell: bash
        run: |
          # Set longer npm timeout
          npm config set fetch-timeout 600000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          # Retry logic for npm ci with all dependencies including Electron
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            echo "Installing all dependencies (this may take several minutes)..."

            if npm ci --prefer-offline --no-audit; then
              echo "✓ npm ci succeeded"
              break
            else
              if [ $i -eq 3 ]; then
                echo "✗ npm ci failed after 3 attempts"
                exit 1
              fi
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done
        timeout-minutes: 20

      - name: Build application
        run: npm run build

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        run: npm run dist:linux
        timeout-minutes: 30

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        run: npm run dist:win
        timeout-minutes: 30

      - name: Build distributables (macOS)
        if: matrix.platform == 'mac'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false  # 禁用代码签名（如果没有证书）
        timeout-minutes: 40

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-distributables
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-distributables
          path: release/*.exe
          retention-days: 7

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-distributables
          path: release/*.dmg
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-distributables/*
            artifacts/windows-distributables/*
            artifacts/macos-distributables/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
