name: Test Build

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Configure Git Bash (Windows)
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\\Program Files\\git\\bin\\bash.exe"

      - name: Install dependencies
        shell: bash
        run: |
          # Set longer npm timeout
          npm config set fetch-timeout 600000
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          # Retry logic for npm ci
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            echo "Installing all dependencies (this may take several minutes)..."

            if npm ci --prefer-offline --no-audit; then
              echo "✓ npm ci succeeded"
              break
            else
              if [ $i -eq 3 ]; then
                echo "✗ npm ci failed after 3 attempts"
                exit 1
              fi
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done
        timeout-minutes: 20

      - name: Build webpack bundles
        run: npm run build

      - name: Test package (no actual distribution)
        run: npm run pack
